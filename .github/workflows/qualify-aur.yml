name: Qualify AUR package 1.0.1
on:
  workflow_dispatch:
  push:
    branches: [qualification-1.0.1]
    paths:
      - 'aur/**'
      - '.github/workflows/qualify-aur.yml'
permissions:
  contents: read
jobs:
  arch-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: archlinux/archlinux:base-devel
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build and inspect unchanged release in disposable Arch container
        shell: bash
        env:
          HT_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: bash aur/ci-qualify.sh
      - name: Upload qualification evidence only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aur-1.0.1-qualification
          path: aur/evidence/
          retention-days: 14
          if-no-files-found: error
